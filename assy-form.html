<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSY Control Panel</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .card-header { background-color: #212529 !important; border-top-left-radius: 16px !important; border-top-right-radius: 16px !important; }
        .andon-btn { 
            height: 140px; 
            font-size: 22px; 
            font-weight: 800; 
            border-radius: 12px; 
            border: none; 
            box-shadow: 0 6px 0 #b02a37; 
            transition: 0.1s; 
        }
        .andon-btn:active { 
            transform: translateY(6px); 
            box-shadow: none; 
        }
        .btn-conveyor {
            background-color: #ffc107 !important;
            color: #212529 !important;
            box-shadow: 0 6px 0 #d39e00;
        }
    </style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card bg-white shadow">
            <div class="card-header text-white text-center py-3">
                <h4 class="mb-0 fw-bold">🔴 ASSY Direct Trigger Interface</h4>
                <small class="opacity-75">Instant Line Halt System</small>
            </div>
            <div class="card-body p-4 d-grid gap-4">
                <button class="btn btn-danger andon-btn text-white" onclick="triggerAssyAlarm('ckt')">
                    🚨 CKT BREAKDOWN STALL
                </button>
                <button class="btn btn-conveyor andon-btn" onclick="triggerAssyAlarm('conveyor')">
                    ⚠️ CONVEYOR LINE EMERGENCY STOP
                </button>
            </div>
        </div>
    </div>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // ⚠️ YAHA APNA FIREBASE CONFIG PASTE KAREIN
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function triggerAssyAlarm(machineKey) {
            const timeString = new Date().toLocaleTimeString();
            database.ref('assy/' + machineKey).set({
                status: "DOWN",
                timestamp: timeString,
                startTimestamp: Date.now()
            }).then(() => {
                alert(`ASSY Emergency Signal Dispatched Successfully!`);
            });
        }
    </script>
</body>
</html>
