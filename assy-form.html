<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSY One-Click Andon</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        .andon-btn { height: 150px; font-size: 24px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-dark text-white text-center">
                <h4>🔴 ASSY Production Line (One-Click)</h4>
            </div>
            <div class="card-body d-grid gap-4 p-4">
                <button class="btn btn-danger andon-btn" onclick="triggerAssyAlarm('ckt')">🚨 CKT Breakdown</button>
                <button class="btn btn-warning text-white andon-btn" onclick="triggerAssyAlarm('conveyor')">⚠️ Conveyor Stop</button>
            </div>
        </div>
    </div>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // ⚠️ YAHA APNA FIREBASE CONFIG PASTE KAREIN
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function triggerAssyAlarm(machineKey) {
            const timeString = new Date().toLocaleTimeString();
            database.ref('assy/' + machineKey).set({
                status: "DOWN",
                timestamp: timeString,
                startTimestamp: Date.now()
            }).then(() => {
                alert(`ASSY Alarm Sent Successfully!`);
            });
        }
    </script>
</body>
</html>
