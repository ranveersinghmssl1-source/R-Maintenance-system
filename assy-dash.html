<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSY Mobile Dashboard</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        .andon-card { height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 24px; font-weight: bold; border-radius: 12px; transition: 0.3s; cursor: pointer; }
        .bg-running { background: linear-gradient(145deg, #198754, #146c43); }
        .bg-breakdown { background: linear-gradient(145deg, #dc3545, #b02a37); animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.7; } }
        @media (max-width: 576px) {
            h2 { font-size: 20px; }
            .andon-card { height: 140px; font-size: 20px; }
        }
    </style>
</head>
<body class="bg-dark text-white">
    <div class="container text-center mt-4 px-3">
        <h2 class="mb-4">🔴 ASSY Live Mobile Andon Board</h2>
        <audio id="sirenSound" src="https://mixkit.co" preload="auto" loop></audio>

        <div class="row g-3">
            <div class="col-12 col-md-6">
                <div id="cktCard" class="andon-card bg-running shadow-sm" onclick="resetMachine('ckt', 'CKT MACHINE')">
                    <div id="cktTitle">CKT MACHINE</div>
                    <span class="fs-6 mt-2 opacity-75" id="cktTime">STATUS: RUNNING</span>
                </div>
            </div>
            <div class="col-12 col-md-6">
                <div id="conveyorCard" class="andon-card bg-running shadow-sm" onclick="resetMachine('conveyor', 'CONVEYOR LINE')">
                    <div id="conveyorTitle">CONVEYOR LINE</div>
                    <span class="fs-6 mt-2 opacity-75" id="conveyorTime">STATUS: RUNNING</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // ⚠️ YAHA APNA FIREBASE CONFIG PASTE KAREIN
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let initialLoad = true;

        database.ref('assy').on('value', (snapshot) => {
            const data = snapshot.val();
            const siren = document.getElementById('sirenSound');
            let anyMachineDown = false;

            if(data) {
                const cktDown = updateUI('ckt', data.ckt);
                const conveyorDown = updateUI('conveyor', data.conveyor);
                anyMachineDown = cktDown || conveyorDown;
            }

            if (anyMachineDown) {
                if (!initialLoad) { siren.play().catch(e => console.log("Audio blocked")); }
            } else {
                siren.pause(); siren.currentTime = 0;
            }
            initialLoad = false;
        });

        function updateUI(key, machineData) {
            const card = document.getElementById(key + 'Card');
            const title = document.getElementById(key + 'Title');
            const timeText = document.getElementById(key + 'Time');
            const displayName = key === 'ckt' ? 'CKT MACHINE' : 'CONVEYOR LINE';

            if(machineData && machineData.status === "DOWN") {
                card.className = "andon-card bg-breakdown shadow-sm";
                title.innerHTML = `🚨 ${displayName}`;
                timeText.innerHTML = `DOWN SINCE: ${machineData.timestamp}`;
                return true;
            } else {
                card.className = "andon-card bg-running shadow-sm";
                title.innerHTML = displayName;
                timeText.innerHTML = "STATUS: RUNNING";
                return false;
            }
        }

        function resetMachine(key, displayName) {
            if(confirm(`Kya ${displayName} theek ho gayi hai?`)) {
                database.ref('assy/' + key).once('value').then((snapshot) => {
                    const currentData = snapshot.val();
                    if (currentData && currentData.status === "DOWN") {
                        database.ref('history_logs').push({
                            section: "ASSY",
                            machine: displayName,
                            problem: "Line Breakdown Stopped",
                            timestamp: currentData.timestamp
                        }).then(() => {
                            database.ref('assy/' + key).set({ status: "RUNNING", timestamp: "-" });
                        });
                    } else {
                        database.ref('assy/' + key).set({ status: "RUNNING", timestamp: "-" });
                    }
                });
            }
        }
    </script>
</body>
</html>
