<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andon System Login</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); height: 100vh; display: flex; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">🚨 Andon System Login</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">User Role ID</label>
                                <input type="text" class="form-control" id="userID" placeholder="Enter Role ID" required autocomplete="off">
                                <div class="form-text text-muted">Roles: lpc_op, lpc_maint, assy_op, assy_maint, plant_manager</div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control" id="password" value="12345" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">LOG IN</button>
                        </form>
                        <div id="errorMessage" class="text-danger text-center mt-3 fw-bold" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('userID').value.trim().toLowerCase();
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');

            if (pass === '12345') {
                errorDiv.style.display = 'none';
                if (user === 'lpc_op') { window.location.href = 'lpc-form.html'; }
                else if (user === 'lpc_maint') { window.location.href = 'lpc-dash.html'; }
                else if (user === 'assy_op') { window.location.href = 'assy-form.html'; }
                else if (user === 'assy_maint') { window.location.href = 'assy-dash.html'; }
                else if (user === 'plant_manager') { window.location.href = 'analytics.html'; }
                else {
                    errorDiv.innerText = "❌ Role ID nahi mila!";
                    errorDiv.style.display = 'block';
                }
            } else {
                errorDiv.innerText = "❌ Galat Password!";
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
