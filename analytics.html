<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andon Performance Analytics</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📊 Plant Maintenance Analytics Dashboard</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">Back to Login</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-white fw-bold">🔥 Top Down Machines (Frequency)</div>
                    <div class="card-body"><canvas id="machineChart"></canvas></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-white fw-bold">🛠️ Problem Types Distribution</div>
                    <div class="card-body"><canvas id="problemChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // ⚠️ YAHA APNA FIREBASE CONFIG OBJECT PASTE KAREIN
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let machineChart, problemChart;

        database.ref('history_logs').on('value', (snapshot) => {
            const data = snapshot.val();
            const machineCounts = {};
            const problemCounts = {};

            if (data) {
                Object.keys(data).forEach(key => {
                    const log = data[key];
                    machineCounts[log.machine] = (machineCounts[log.machine] || 0) + 1;
                    if(log.problem) {
                        problemCounts[log.problem] = (problemCounts[log.problem] || 0) + 1;
                    }
                });
            }
            renderCharts(machineCounts, problemCounts);
        });

        function renderCharts(machines, problems) {
            if(machineChart) machineChart.destroy();
            if(problemChart) problemChart.destroy();

            const mCtx = document.getElementById('machineChart').getContext('2d');
            machineChart = new Chart(mCtx, {
                type: 'bar',
                data: {
                    labels: Object.keys(machines),
                    datasets: [{ label: 'Breakdown Counts', data: Object.values(machines), backgroundColor: '#dc3545', borderRadius: 5 }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

            const pCtx = document.getElementById('problemChart').getContext('2d');
            problemChart = new Chart(pCtx, {
                type: 'pie',
                data: {
                    labels: Object.keys(problems),
                    datasets: [{ data: Object.values(problems), backgroundColor: ['#ffc107', '#0d6efd', '#198754', '#6c757d', '#dc3545'] }]
                },
                options: { responsive: true }
            });
        }
    </script>
</body>
</html>
