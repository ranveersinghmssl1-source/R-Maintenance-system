<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andon Maintenance History</title>
    <!-- Bootstrap CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- SheetJS Library for Excel Export -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @media (max-width: 576px) {
            .navbar-brand { font-size: 16px; }
            .btn-excel { width: 100%; margin-top: 10px; }
        }
    </style>
</head>
<body class="bg-light">
    <!-- Top Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">📊 Andon Breakdown History Log</span>
            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm me-2">Back to Login</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
            <h4 class="mb-0">Past Breakdown Events</h4>
            <!-- Excel Export Button -->
            <button class="btn btn-success btn-excel fw-bold" onclick="exportToExcel()">📥 Export to Excel (.xlsx)</button>
        </div>

        <div class="card shadow border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0" id="historyTable">
                        <thead class="table-dark">
                            <tr>
                                <th>Shift</th>
                                <th>Line / Section</th>
                                <th>Machine Name</th>
                                <th>Problem Type</th>
                                <th>Root Cause</th>
                                <th>Action Taken</th>
                                <th>Time Reported</th>
                                <th>Response (Sec)</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr><td colspan="9" class="text-center text-muted py-4">No history records found.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // ⚠️ YAHA APNA FIREBASE CONFIG PASTE KAREIN
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allLogsData = []; // Excel export ke liye raw data store karne ke liye

        // Firebase se history data check karna
        database.ref('history_logs').limitToLast(100).on('value', (snapshot) => {
            const data = snapshot.val();
            const tableBody = document.getElementById('historyTableBody');
            tableBody.innerHTML = "";
            allLogsData = []; // Clear previous

            if(data) {
                Object.keys(data).reverse().forEach(key => {
                    const log = data[key];
                    
                    // Default values set karna agar fields khali hono toh
                    const shift = log.shift || "N/A";
                    const rootCause = log.rootCause || "N/A";
                    const actionTaken = log.actionTaken || "N/A";
                    const respTime = log.responseTimeSec !== undefined ? log.responseTimeSec : "N/A";

                    // Array me raw data save karein taaki Excel output clean mile
                    allLogsData.push({
                        "Shift": shift,
                        "Section": log.section,
                        "Machine": log.machine,
                        "Problem": log.problem,
                        "Root Cause": rootCause,
                        "Action Taken": actionTaken,
                        "Time Reported": log.timestamp,
                        "Response Time (Sec)": respTime,
                        "Status": "RESOLVED"
                    });

                    const row = `
                        <tr>
                            <td><span class="badge bg-dark">${shift}</span></td>
                            <td><span class="badge bg-secondary">${log.section.toUpperCase()}</span></td>
                            <td><strong>${log.machine}</strong></td>
                            <td>${log.problem}</td>
                            <td><small>${rootCause}</small></td>
                            <td><small>${actionTaken}</small></td>
                            <td>${log.timestamp}</td>
                            <td><span class="fw-bold text-dark">${respTime}s</span></td>
                            <td><span class="badge bg-success">RESOLVED ✅</span></td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } else {
                tableBody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-4">No history records found.</td></tr>`;
            }
        });

        // 📥 Smart Excel Export Function
        function exportToExcel() {
            if (allLogsData.length === 0) {
                alert("Export karne ke liye koi data nahi mila!");
                return;
            }
            
            // JSON data ko worksheet me convert karein
            const worksheet = XLSX.utils.json_to_sheet(allLogsData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Breakdown History");

            // File automatic download trigger karein
            XLSX.writeFile(workbook, "Andon_Breakdown_Report.xlsx");
        }
    </script>
</body>
</html>
