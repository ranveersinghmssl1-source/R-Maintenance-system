<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPC Maintenance Form</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>⚠️ LPC Maintenance Call (C&C)</h4>
            </div>
            <div class="card-body">
                <form id="lpcForm">
                    <!-- Dynamic Detected Shift Information -->
                    <div class="alert alert-secondary py-2 text-center fw-bold text-dark mb-3">
                        ⏱️ Auto Detected Shift: <span id="detectedShift" class="text-primary">Detecting...</span>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Select C&C Machine</label>
                        <select class="form-select" id="machineSelect" required>
                            <option value="" selected disabled>-- Choose Machine --</option>
                            <option value="CNC-01">C&C Machine 01</option>
                            <option value="CNC-02">C&C Machine 02</option>
                            <option value="CNC-03">C&C Machine 03</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Machine Problem Type</label>
                        <select class="form-select" id="problemSelect" required>
                            <option value="" selected disabled>-- Select Problem --</option>
                            <option value="Mechanical Fault">Mechanical Fault (Geobox/Spindle)</option>
                            <option value="Electrical Fault">Electrical Fault (Power/Wiring)</option>
                            <option value="Tooling Issue">Tooling/Insert Broken</option>
                            <option value="Hydraulic/Pneumatic">Hydraulic / Pneumatic Leakage</option>
                            <option value="Software/CNC Error">Software / CNC Screen Error</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Operator Remarks (Optional)</label>
                        <textarea class="form-control" id="remarks" rows="3" placeholder="Describe the issue..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Raise Andon Alarm 🚨</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // ⚠️ YAHA APNA FIREBASE CONFIG PASTE KAREIN
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ⏰ Automatic Shift Calculator Engine
        function getActiveShift() {
            const currentHour = new Date().getHours();
            // Rules: Shift A (06:00 to 14:00), Shift B (14:00 to 22:00), Shift C (22:00 to 06:00)
            if (currentHour >= 6 && currentHour < 14) { return "Shift A"; } 
            else if (currentHour >= 14 && currentHour < 22) { return "Shift B"; } 
            else { return "Shift C"; }
        }

        // On screen loading shift name display karein
        const currentActiveShift = getActiveShift();
        document.getElementById('detectedShift').innerText = currentActiveShift;

        document.getElementById('lpcForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const machine = document.getElementById('machineSelect').value;
            const problem = document.getElementById('problemSelect').value;
            const remarks = document.getElementById('remarks').value || "No remarks";
            const timeString = new Date().toLocaleTimeString();

            database.ref('lpc_calls/' + machine).set({
                machine: machine,
                problem: problem,
                remarks: remarks,
                timestamp: timeString,
                startTimestamp: Date.now(),
                shift: currentActiveShift, // Auto shift parameters update
                status: "ACTIVE"
            }).then(() => {
                alert(`LPC Alarm Raised successfully for ${machine}!`);
                document.getElementById('lpcForm').reset();
            });
        });
    </script>
</body>
</html>
