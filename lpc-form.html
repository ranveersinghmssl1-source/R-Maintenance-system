<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPC Operator Panel</title>
    <!-- Premium Bootstrap 5 CSS Framework -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-primary { padding: 12px; font-size: 16px; border-radius: 8px; background-color: #0d6efd; border: none; }
        .btn-primary:hover { background-color: #0b5ed7; }
        .form-select, .form-control { padding: 10px; border-radius: 8px; }
        .navbar { background-color: #212529; }
    </style>
</head>
<body class="pb-5">

    <!-- Operator Header Navbar with Logout Option -->
    <nav class="navbar navbar-dark shadow-sm mb-4">
        <div class="container-fluid px-3 d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1 fw-bold fs-6">🤖 Operator Terminal (LPC)</span>
            <button class="btn btn-outline-danger btn-sm fw-bold" onclick="window.location.replace('index.html')">🚪 Log Out</button>
        </div>
    </nav>

    <div class="container" style="max-width: 500px;">
        <div class="card bg-white mt-2">
            <div class="card-header bg-primary text-white text-center py-3 rounded-top">
                <h4 class="mb-0 fw-bold">⚠️ LPC Andon Call Panel</h4>
                <small class="opacity-75">C&C Machine Station</small>
            </div>
            <div class="card-body p-4">
                <form id="lpcForm">
                    <!-- Auto Shift Display -->
                    <div class="alert alert-light border d-flex justify-content-between align-items-center py-2 px-3 mb-4 rounded-3">
                        <span class="text-secondary fw-bold small">Current Station Timing:</span>
                        <span id="detectedShift" class="badge bg-dark fs-6 px-3">Detecting...</span>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">Select C&C Machine ID</label>
                        <select class="form-select" id="machineSelect" required>
                            <option value="" selected disabled>-- Choose Active Machine --</option>
                            <option value="CNC-01">C&C Machine 01</option>
                            <option value="CNC-02">C&C Machine 02</option>
                            <option value="CNC-03">C&C Machine 03</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">Machine Problem Type</label>
                        <select class="form-select" id="problemSelect" required>
                            <option value="" selected disabled>-- Identify Error Type --</option>
                            <option value="Mechanical Fault">Mechanical Fault (Geobox/Spindle)</option>
                            <option value="Electrical Fault">Electrical Fault (Power/Wiring)</option>
                            <option value="Tooling Issue">Tooling/Insert Broken</option>
                            <option value="Hydraulic/Pneumatic">Hydraulic / Pneumatic Leakage</option>
                            <option value="Software/CNC Error">Software / CNC Screen Error</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary">Operator Remarks</label>
                        <textarea class="form-control" id="remarks" rows="3" placeholder="Describe current floor observations..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">RAISE ANDON ALARM 🚨</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // ⚠️ YAHA APNA FIREBASE CONFIG PASTE KAREIN (DONO FILES ME EXACT SAME HONA CHAHIYE)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Automatic Shift Detection Logic
        function getActiveShift() {
            const currentHour = new Date().getHours();
            if (currentHour >= 6 && currentHour < 14) { return "Shift A"; } 
            else if (currentHour >= 14 && currentHour < 22) { return "Shift B"; } 
            else { return "Shift C"; }
        }

        const currentActiveShift = getActiveShift();
        document.getElementById('detectedShift').innerText = currentActiveShift;

        // Form Submit Handler
        document.getElementById('lpcForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const machine = document.getElementById('machineSelect').value;
            const problem = document.getElementById('problemSelect').value;
            const remarks = document.getElementById('remarks').value || "No remarks";
            const timeString = new Date().toLocaleTimeString();

            // Firebase database update logic path configuration
            database.ref('lpc_calls/' + machine).set({
                machine: machine,
                problem: problem,
                remarks: remarks,
                timestamp: timeString,
                startTimestamp: Date.now(), // Dynamic countdown reference
                shift: currentActiveShift,   // Shift assignment variables
                status: "ACTIVE"             // Entry code status marker
            }).then(() => {
                alert(`LPC Alarm Raised successfully for ${machine}!`);
                document.getElementById('lpcForm').reset();
            }).catch((error) => {
                alert("Database Error: " + error.message);
            });
        });
    </script>
</body>
</html>
